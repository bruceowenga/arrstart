app: prowlarr
slot: indexer
image: prowlarr   # key into templates/versions.yaml images map (pinned tag, never latest)
ports:
  - container: 9696
    host: 9696
volumes:
  - host: "<root>/config/prowlarr"
    container: /config
environment:
  - name: PUID
    value: "${PUID}"
  - name: PGID
    value: "${PGID}"
  - name: TZ
    value: "${TZ}"
healthcheck:
  test:
    - CMD
    - curl
    - -f
    - http://localhost:9696/
  interval: 30s
  timeout: 10s
  retries: 3
ram_estimate_mb: 300
user_rules:
  os:
    - linux
    - darwin
  puid_pgid: true
