app: sonarr
slot: media-manager
image: sonarr   # key into templates/versions.yaml images map (pinned tag, never latest)
ports:
  - container: 8989
    host: 8989
volumes:
  - host: "<root>/config/sonarr"
    container: /config
  - host: "<root>/data"
    container: /data
environment:
  - name: PUID
    value: "${PUID}"
  - name: PGID
    value: "${PGID}"
  - name: TZ
    value: "${TZ}"
healthcheck:
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8989/
  interval: 30s
  timeout: 10s
  retries: 3
ram_estimate_mb: 400
user_rules:
  os:
    - linux
    - darwin
  puid_pgid: true
