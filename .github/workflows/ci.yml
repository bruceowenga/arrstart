name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          # Pinned tool version; was "latest" before this PR.
          version: v1.64.5

      - name: shellcheck
        run: |
          # Fail loudly if shellcheck cannot be installed -- never skip.
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          if [ -f install.sh ]; then
            shellcheck install.sh
          fi

      - name: markdownlint
        uses: igorshubovych/markdownlint-cli@192ad822316c3a22fb3d3cc8aa6eafa0b8488360 # v0.45.0
        with:
          config-file: .markdownlint.yaml
          files: 'docs/**/*.md'

      - name: gofmt
        run: |
          # Hard fail on any unformatted file (non-empty gofmt -l output).
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt violations:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' (or 'make fmt') to fix."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: make build
        run: make build

      - name: arrstart version
        run: ./bin/arrstart version

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: go test
        run: |
          PACKAGES=$(go list ./...)
          if [ -n "$PACKAGES" ]; then
            go test ./... -race
          else
            echo "No Go packages to test yet"
          fi

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title (Conventional Commits)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^(build|ci|docs|feat|fix|perf|refactor|style|test|chore)(\(.+\))?!?: .+'; then
            echo "PR title does not follow Conventional Commits: $PR_TITLE"
            echo "Expected: <type>(<scope>): <summary> (e.g. feat(wizard): add health endpoint)"
            exit 1
          fi
