name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: shellcheck
        run: |
          if [ -f install.sh ]; then
            sudo apt-get update -y && sudo apt-get install -y shellcheck
            shellcheck install.sh
          else
            echo "install.sh not present; skipping shellcheck"
          fi

      - name: markdownlint
        uses: igorshubovych/markdownlint-cli@v0.45.0
        with:
          config-file: .markdownlint.yaml
          files: 'docs/**/*.md'

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go test
        run: |
          PACKAGES=$(go list ./...)
          if [ -n "$PACKAGES" ]; then
            go test ./... -race
          else
            echo "No Go packages to test yet"
          fi

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title (Conventional Commits)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^(build|ci|docs|feat|fix|perf|refactor|style|test|chore)(\(.+\))?!?: .+'; then
            echo "PR title does not follow Conventional Commits: $PR_TITLE"
            echo "Expected: <type>(<scope>): <summary> (e.g. feat(wizard): add health endpoint)"
            exit 1
          fi
