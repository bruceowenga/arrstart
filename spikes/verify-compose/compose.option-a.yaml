# Option A experiment: qBittorrent with pre-seeded Password_PBKDF2 hash.
# THROWAWAY - delete after the experiment.
services:
  qbittorrent-a:
    image: linuxserver/qbittorrent:5.3.0_v2.1.2-ls488
    container_name: vfy-qbittorrent-a
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
    volumes:
      - ./scratch/qbittorrent-b:/config
    restart: "no"
