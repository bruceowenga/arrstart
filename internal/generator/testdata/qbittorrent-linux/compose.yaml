# arrstart generated compose — hand-editable. Never use the latest tag.
services:
  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0_v2.1.2-ls488
    ports:
      - "8080:8080"
    volumes:
      - "/srv/media/config/qbittorrent:/config"
      - "/srv/media/data:/data"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3