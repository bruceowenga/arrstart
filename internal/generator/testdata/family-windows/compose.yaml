# arrstart generated compose — hand-editable. Never use the latest tag.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - "C:/Media/config/jellyfin:/config"
      - "C:/Media/config/jellyfin-cache:/cache"
      - "C:/Media/data:/data:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/"]
      interval: 30s
      timeout: 10s
      retries: 3
  prowlarr:
    image: linuxserver/prowlarr:3.0.2
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - "C:/Media/config/prowlarr:/config"
    environment:
      TZ: "${TZ}"
      PROWLARR__AUTH__APIKEY: "${PROWLARR_APIKEY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/"]
      interval: 30s
      timeout: 10s
      retries: 3
  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0_v2.1.2-ls488
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - "C:/Media/config/qbittorrent:/config"
      - "C:/Media/data:/data"
    environment:
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
  radarr:
    image: linuxserver/radarr:7.0.3
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - "C:/Media/config/radarr:/config"
      - "C:/Media/data:/data"
    environment:
      TZ: "${TZ}"
      RADARR__AUTH__APIKEY: "${RADARR_APIKEY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/"]
      interval: 30s
      timeout: 10s
      retries: 3
  seerr:
    image: seerr/seerr@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - "C:/Media/config/seerr:/app/config"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
  sonarr:
    image: linuxserver/sonarr:4.0.20.3014-ls6
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - "C:/Media/config/sonarr:/config"
      - "C:/Media/data:/data"
    environment:
      TZ: "${TZ}"
      SONARR__AUTH__APIKEY: "${SONARR_APIKEY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/"]
      interval: 30s
      timeout: 10s
      retries: 3
